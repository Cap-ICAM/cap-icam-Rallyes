<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symphonie du Cap'tain - Cap'Icam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="rythme.css">
    <link rel="icon" href="assets/logo_zoomed.jpg">
</head>

<body>

    <div id="game-container">
        <!-- Tracks -->
        <div class="tracks-container">
            <div class="track" id="track-0"></div>
            <div class="track" id="track-1"></div>
            <div class="track" id="track-2"></div>
            <div class="track" id="track-3"></div>
        </div>

        <!-- Hit Line (Target) -->
        <div class="hit-line"></div>

        <!-- Touch Zones (Full screen tactile areas) -->
        <div class="touch-zones">
            <div class="touch-zone"><span>S / J1</span></div>
            <div class="touch-zone"><span>D / J2</span></div>
            <div class="touch-zone"><span>K / J3</span></div>
            <div class="touch-zone"><span>L / J4</span></div>
        </div>

        <!-- Score & UI -->
        <div id="score-display">0</div>
        <div id="combo-display">COMBO x0</div>

        <audio id="audio-player" src="assets/musique.mp3"></audio>

        <!-- Dynamic Waves Background -->
        <div class="game-waves">
            <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
                <defs>
                    <path id="gentle-wave"
                        d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                </defs>
                <g class="parallax">
                    <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(200, 178, 115, 0.2)" />
                    <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(200, 178, 115, 0.1)" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <a href="games.html" class="return-btn">⬅ Retour à l'Arcade</a>
        <h1>Symphonie du Cap'tain 🎻</h1>
        <p>Tape les pièces dorées en rythme avec l'hymne !</p>
        <div style="margin: 20px 0;">
            <input type="text" id="playerName" placeholder="Ton Prénom NOM" maxlength="25">
        </div>
        <button onclick="startGame()">LANCER LA MUSIQUE</button>
        <p style="margin-top: 20px; font-size: 0.8rem; color: #ccc;">Touches: S, D, K, L ou Écran Tactile</p>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" style="display: none;">
        <h1 id="game-over-title">CONCERT FINI ! ⚓</h1>
        <p id="final-stats">Score: 0 | Combo Max: 0</p>
        <button onclick="location.reload()">REESSAYER</button>
        <br><br>
        <a href="games.html" style="color: #c8b273; text-decoration: none;">Quitter le concert</a>
    </div>

    <script src="rythme.js"></script>
</body>

</html>
