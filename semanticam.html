<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sémanticam - Le Jeu de Mots Cap'Icam ⚓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="assets/logo_zoomed.jpg">
    <style>
        :root {
            --primary-blue: #1a2b49;
            --accent-gold: #c8b273;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --cold: #bae6fd;
            --tepid: #fbbf24;
            --hot: #ef4444;
        }

        body {
            background: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-layout {
            display: flex;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            padding: 40px 20px;
        }

        /* Sidebar info */
        .sidebar {
            flex: 0 0 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {
            background: var(--tepid);
            color: var(--primary-blue);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .info-card h2 { margin: 0 0 10px 0; font-family: 'Montserrat'; font-size: 1.2rem; }
        .info-card .day-num { font-size: 1.8rem; font-weight: 800; }
        
        .yesterday-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Game Area */
        .game-area {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header { text-align: center; }
        header h1 { 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 800; 
            color: var(--accent-gold); 
            letter-spacing: 3px;
            margin: 10px 0;
        }
        
        .input-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 1.1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent-gold); }

        .btn-submit {
            background: #475569;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Large Progress Bar for last guess */
        #last-guess-meter {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            animation: fadeIn 0.5s;
        }

        .meter-label { display: flex; justify-content: space-between; font-weight: 700; }
        .meter-bar { height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; }
        .meter-fill { height: 100%; width: 0; transition: width 1s cubic-bezier(0.1, 0.5, 0.5, 1); }

        /* Guesses Table */
        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 100px 150px;
            padding: 0 15px;
            font-weight: 700;
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .guesses-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .guess-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 150px;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .guess-row.newest { border: 1px solid var(--accent-gold); }

        .row-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
        .row-fill { height: 100%; border-radius: 4px; }

        .hot { color: var(--hot); }
        .tepid { color: var(--tepid); }
        .cold { color: var(--cold); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Navigation */
        .nav-back {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #victory-screen {
            display: none;
            text-align: center;
            padding: 30px;
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid #22c55e;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column; }
            .sidebar { flex: none; order: 1; }
            .game-area { order: 0; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="info-card">
                <h2>CÉMANTICAM</h2>
                <div class="day-num">Jour n°1</div>
                <div style="margin-top: 10px; opacity: 0.8">⚓ Cap'Icam Rallye</div>
            </div>

            <div class="yesterday-card">
                <div style="opacity: 0.6; margin-bottom: 5px;">Le mot d'hier était</div>
                <div style="font-weight: 800; color: var(--accent-gold); text-transform: uppercase;">BOUSSOLE</div>
            </div>

            <a href="games.html" class="nav-back"><i class="fas fa-arrow-left"></i> Retour Arcade</a>
        </aside>

        <!-- MAIN GAME PANEL -->
        <main class="game-area">
            <header>
                <h1>SÉMANTICAM</h1>
                <p style="opacity: 0.7">Près ou loin ? Le sens vous guidera.</p>
            </header>

            <div id="victory-screen">
                <i class="fas fa-trophy fa-4x" style="color: #fbbf24; margin-bottom: 20px;"></i>
                <h2 style="color: #4ade80; margin: 0">VICTOIRE !</h2>
                <p>Vous avez trouvé le mot secret : <strong id="reveal-word" style="text-transform: uppercase; color: white;"></strong></p>
                <button onclick="location.reload()" style="background: var(--accent-gold); border: none; padding: 10px 25px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px;">NOUVEAU MOT</button>
            </div>

            <form id="guessForm" class="input-box">
                <input type="text" id="guessInput" placeholder="Saisir un mot..." autocomplete="off">
                <button type="submit" class="btn-submit">ENVOYER</button>
            </form>

            <div id="last-guess-meter">
                <div class="meter-label">
                    <span id="last-word-text" style="text-transform: uppercase;">...</span>
                    <span id="last-score-text">0.00%</span>
                </div>
                <div class="meter-bar">
                    <div id="last-meter-fill" class="meter-fill"></div>
                </div>
                <div id="temperature-text" style="text-align: center; font-size: 0.8rem; font-weight: 800;"></div>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <span>N°</span>
                    <span>Mot</span>
                    <span>Score</span>
                    <span>Progression</span>
                </div>
                <hr style="border: none; border-top: 1px solid #334155; margin: 10px 0;">
                <div class="guesses-container" id="guessesList">
                    <!-- Rows injected here -->
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="semanticam.js"></script>
</body>
</html>
