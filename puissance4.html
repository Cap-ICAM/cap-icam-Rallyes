<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissance 4 - Cap'Icam</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="assets/logo_zoomed.jpg">
    <style>
        :root {
            --primary-blue: #1a2b49;
            --accent-gold: #c8b273;
            --sky-blue: #74b9d3;
            --board-blue: #2980b9;
            --p1-color: #e74c3c; /* Red */
            --p2-color: #f1c40f; /* Yellow */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, var(--primary-blue), #0a1526);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin-top: 2rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
        }
        
        .header p {
            margin: 0;
            opacity: 0.8;
        }

        .controls {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        button {
            background: var(--accent-gold);
            color: var(--primary-blue);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 178, 115, 0.4);
        }

        .difficulty-select {
            background: rgba(26, 43, 73, 0.8);
            color: #fff;
            border: 2px solid var(--accent-gold);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2012%2012%22%3E%3Cpath%20fill%3D%22%23c8b273%22%20d%3D%22M10.293%203.293L6%207.586%201.707%203.293A1%201%200%2000.293%204.707l5%205a1%201%200%20001.414%200l5-5a1%201%200%2010-1.414-1.414z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            padding-right: 2.5rem;
        }

        .difficulty-select:hover {
            border-color: #fff;
        }

        .difficulty-select option {
            background: var(--primary-blue);
            color: #fff;
        }

        .status {
            font-size: 1.2rem;
            font-weight: bold;
            height: 2rem;
            margin-bottom: 1rem;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }

        #board {
            background: var(--board-blue);
            padding: 10px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(7, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: #1a2b49;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
            transition: background 0.3s;
        }

        .rotating-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            margin-top: 1rem;
            animation: rotate-slow 15s linear infinite;
            box-shadow: 0 0 20px rgba(200, 178, 115, 0.4);
            object-fit: cover;
            background: white;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cell.hover-p1 {
            background-image: url('assets/logo.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
        }

        .cell.p1 {
            background-image: url('assets/logo.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            opacity: 1; /* Reset opacity from hover if any */
        }

        .cell.p2 {
            background-image: url('assets/atlanticam_logo.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .return-link {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            margin-bottom: 2rem;
        }

        .return-link:hover {
            color: var(--accent-gold);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            #board {
                grid-template-columns: repeat(7, 40px);
                grid-template-rows: repeat(6, 40px);
                gap: 5px;
                padding: 8px;
            }
            .cell {
                width: 40px;
                height: 40px;
            }
            .controls {
                flex-direction: column;
                align-items: center;
                gap: 0.8rem;
                width: 90%;
            }
            button, .difficulty-select {
                width: 100%;
                max-width: 280px;
                font-size: 0.9rem;
                padding: 0.7rem 1rem;
            }
        }

        /* Loss Animation & Overlay */
        #lose-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #lose-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .lose-content {
            background: var(--primary-blue);
            padding: 3rem;
            border-radius: 20px;
            border: 3px solid var(--accent-gold);
            text-align: center;
            max-width: 400px;
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(200, 178, 115, 0.3);
        }

        #lose-overlay.show .lose-content {
            transform: scale(1);
        }

        .lose-title {
            color: var(--accent-gold);
            font-size: 3rem;
            margin-bottom: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        .funny-face {
            font-size: 5rem;
            margin: 1.5rem 0;
            animation: bounce 0.8s infinite alternate;
            display: inline-block;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .lose-shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .lose-content button {
            margin-top: 2rem;
            width: 100%;
        }

        /* Win Animation & Overlay */
        #win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 43, 73, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            overflow: hidden;
        }

        #win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-content {
            background: #fff;
            padding: 3rem;
            border-radius: 20px;
            border: 4px solid var(--accent-gold);
            text-align: center;
            max-width: 450px;
            transform: scale(0.5) rotate(-10deg);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(200, 178, 115, 0.6);
            color: var(--primary-blue);
            position: relative;
            z-index: 10;
        }

        #win-overlay.show .win-content {
            transform: scale(1) rotate(0deg);
        }

        .win-title {
            color: var(--primary-blue);
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        .win-icon {
            font-size: 5rem;
            margin: 1rem 0;
            animation: celebrate 0.5s infinite alternate;
            display: inline-block;
        }

        @keyframes celebrate {
            from { transform: scale(1) rotate(-10deg); }
            to { transform: scale(1.2) rotate(10deg); }
        }

        .win-content button {
            margin-top: 2rem;
            width: 100%;
            background: var(--primary-blue);
            color: #fff;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-gold);
            top: -10px;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <img src="assets/logo.jpg" class="rotating-logo" alt="Logo Cap'Icam">

    <div class="header">
        <h1>Puissance 4 ⚓</h1>
        <p>Affrontez l'IA <span id="ia-name">Atlanticam</span></p>
    </div>

    <div class="status" id="status">À vous de jouer !</div>

    <div id="board"></div>

    <div class="controls">
        <select id="difficulty" class="difficulty-select">
            <option value="medium" selected>Difficulté : Medium</option>
            <option value="hardcore">Difficulté : Hardcore (IA Actuelle)</option>
        </select>
        <button id="restart-btn">Nouvelle Partie</button>
    </div>

    <a href="games.html" class="return-link"><i class="fas fa-arrow-left"></i> Retour à l'Arcade</a>

    <script src="puissance4.js"></script>
</body>
</html>
