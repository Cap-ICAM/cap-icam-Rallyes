<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlappyCap - Cap'Icam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="game.css?v=2">
    <link rel="icon" href="assets/logo_zoomed.jpg">
</head>

<body>

    <!-- Music Player -->
    <audio id="audio-player" src="assets/musique2.mp3" loop></audio>
    <button id="music-btn" title="Hymne Cap'Icam">🎵</button>

    <div id="game-container">
        <div id="score">0</div>
        <div id="ship"></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <a href="games.html" class="return-btn">⬅ Retour à l'Arcade</a>
        <h1>FlappyCap ⛵</h1>
        <p style="margin-bottom: 1rem;">Navigue entre les récifs pour gagner des lots !</p>

        <div class="sound-notice"
            style="margin-bottom: 5px; padding: 10px; background: rgba(200, 178, 115, 0.15); border: 1px solid var(--accent-gold); border-radius: 10px; font-size: 0.85rem; color: #fff; display: flex; align-items: center; gap: 10px; justify-content: center;">
            <span style="font-size: 1.1rem;">🔊</span>
            <span>Activez le <b>son</b> & coupez le <b>silencieux</b> !</span>
        </div>

        <div class="reward-notice"
            style="margin-bottom: 20px; font-size: 0.9rem; color: #c8b273; font-weight: 600; text-align: center;">
            <i class="fas fa-gift"></i> Une récompense à gagner pour les meilleurs marins ! 🏆
        </div>
        <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 0.5rem;">(Ton vrai nom pour le classement)</p>
        <input type="text" id="playerName" placeholder="Prénom NOM" maxlength="25">
        <button onclick="startGame()">JOUER</button>

        <div id="leaderboard">
            <h2>🏆 Meilleurs Marins</h2>
            <div id="leaderboard-list">
                <!-- Scores will be injected here -->
                <div class="score-entry"><span>Chargement...</span><span></span></div>
            </div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" style="display: none;">
        <h1>Naufrage ! 🐙</h1>
        <p id="punchline"
            style="font-style: italic; color: #c8b273; margin-bottom: 1rem; text-align: center; max-width: 80%; font-size: 1.2rem;">
        </p>
        <p style="font-size: 1.5rem; margin-bottom: 2rem;">Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">REJOUER</button>
        <br><br>
        <a href="games.html" style="color: #c8b273; text-decoration: none;">Retour à l'Arcade</a>
    </div>

    <script src="game.js?v=2"></script>
</body>

</html>
